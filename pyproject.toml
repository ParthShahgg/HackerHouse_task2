[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-rag-msmarco-xi"
version = "1.0.0"
description = "Voice-enabled, grounded, abstention-capable multilingual RAG over ai4bharat/MSMARCO-XI"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Integration tests that need Qdrant/Groq/Sarvam are opt-in via markers so the
# default `pytest` run stays green on a laptop with no services configured.
markers = [
    "integration: requires a live Qdrant instance",
    "models: downloads/loads real transformer weights (slow, ~5GB)",
    "external: requires third-party API keys (Groq / Sarvam)",
    "slow: long-running",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
