# ============================================================================
# Local / single-host deployment.
#
#   cp .env.example .env      # fill in SARVAM_API_KEY and GROQ_API_KEY
#   docker compose -f deploy/docker-compose.yml up --build
#   docker compose -f deploy/docker-compose.yml run --rm api \
#       python scripts/build_index.py --mode demo --rebuild
#
# api and qdrant share a network so retrieval is a loopback-speed hop. Keeping
# them co-located matters: with a per-query rerank budget in the tens of ms, a
# cross-region Qdrant would dominate the latency profile.
# ============================================================================

name: voice-rag

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "6333:6333"   # HTTP / dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__ENABLE_TLS: "false"
      QDRANT__LOG_LEVEL: "INFO"
    healthcheck:
      # The image is distroless-ish; use the TCP readiness probe Qdrant exposes.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Secrets come from the host .env - never baked into the image.
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}

      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-msmarco_xi_demo}
      INGEST_MODE: ${INGEST_MODE:-demo}
      LANGUAGES: ${LANGUAGES:-hi,mr,ta,te}
      DATASET_SPLIT: ${DATASET_SPLIT:-validation}

      DEVICE: ${DEVICE:-cpu}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-8}
      QUANTIZE_RERANKER_INT8: ${QUANTIZE_RERANKER_INT8:-true}

      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      GENERATION_BACKEND: ${GENERATION_BACKEND:-groq}
      ENABLE_NLI_GROUNDING: ${ENABLE_NLI_GROUNDING:-true}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_REQUEST_BODIES: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    volumes:
      # Corpus artefacts + evaluation labels + reports persist across restarts.
      - ../data:/app/data
      - ../reports:/app/reports
    # Model weights are resident in-process (~4.9GB). Set a floor so the
      # container is not OOM-killed mid-inference.
    deploy:
      resources:
        limits:
          memory: 10g
        reservations:
          memory: 6g

volumes:
  qdrant_storage:
